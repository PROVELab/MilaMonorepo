[package]
name = "precharge"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 'z'
lto = true

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
panic-halt = "1.0.0"
rtt-target = "0.5.0"
heapless = "0.8"
embedded-hal = "1.0"
static_cell = "2.1"

[dependencies.embassy-stm32]
version = "0.1.0"
features = [
    "stm32f405rg",
    "time",
    "time-driver-any", 
    "memory-x",
    "unstable-pac",
    "exti",
    "chrono",
]

[dependencies.embassy-executor]
version = "0.6.0"
features = [
    "task-arena-size-32768",
    "arch-cortex-m",
    "executor-thread",
    "integrated-timers" 
]

[dependencies.embassy-time]
version = "0.3.2"
features = ["tick-hz-32_768"]

[dependencies.embassy-sync]
version = "0.6.0"

[dependencies.embassy-futures]
version = "0.1.0"

[build-dependencies]
cc = "1.0"
bindgen = "0.69"