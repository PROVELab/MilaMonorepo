# ROS 2 Humble dev box
# Create:  distrobox assemble create --file distrobox.ini
# Rebuild: distrobox assemble create --replace --file distrobox.ini
[ros2]
image=docker.io/library/ros:humble-ros-base
pull=true
# compilers + build (vcpkg needs git curl zip unzip tar pkg-config; gfortran for LAPACK-style ports)
additional_packages="build-essential cmake ninja-build ccache git curl wget zip unzip tar xz-utils bzip2 pkg-config gfortran"
# vcpkg fallbacks for ports built from source (libpcap etc.)
additional_packages="flex bison autoconf automake autoconf-archive libtool"
# C/C++ tooling
additional_packages="gdb valgrind strace clangd-15 clang-format-15 clang-tidy-15"
# python
additional_packages="python3 python3-pip python3-venv"
# shell + everyday utils
additional_packages="zsh tmux htop tree jq less file lsof rsync man-db bash-completion openssh-client ca-certificates gnupg"
# networking (handy for ROS / lidar debugging)
additional_packages="iproute2 iputils-ping net-tools"
# editor helpers (telescope, clipboard)
additional_packages="ripgrep fd-find xclip wl-clipboard"
init_hooks="ln -sf /usr/bin/clangd-15 /usr/local/bin/clangd"
init_hooks="ln -sf /usr/bin/clang-format-15 /usr/local/bin/clang-format"
init_hooks="ln -sf /usr/bin/clang-tidy-15 /usr/local/bin/clang-tidy"
init_hooks="ln -sf /usr/bin/fdfind /usr/local/bin/fd"
init_hooks="curl -L https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz | tar xz -C /opt && ln -sf /opt/nvim-linux-x86_64/bin/nvim /usr/local/bin/nvim"
