alias = "mcu_health"
desc = "Basic MCU health telemetry"

[uptime_s]
type = "u32"
unit = "s"
desc = "Seconds since boot"

[cpu_load_pct]
type = "f32"
unit = "%"
desc = "Estimated total CPU load across both cores"

[free_heap_bytes]
type = "u32"
unit = "B"
desc = "Current free heap"

[min_free_heap_bytes]
type = "u32"
unit = "B"
desc = "Minimum free heap since boot"

[heap_used_pct]
type = "f32"
unit = "%"
desc = "Estimated used heap percentage"

[task_count]
type = "u16"
unit = ""
desc = "Current FreeRTOS task count"
